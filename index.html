<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboFactory — Пульт сборщика PRO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #05070f;
    --bg-panel: #0d1322;
    --bg-card: #111a2e;
    --bg-card-hover: #16213a;
    --accent-cyan: #00e5ff;
    --accent-purple: #a855f7;
    --accent-pink: #ec4899;
    --accent-green: #10b981;
    --accent-orange: #f59e0b;
    --accent-red: #ef4444;
    --accent-gold: #fbbf24;
    --text-main: #e5e7eb;
    --text-dim: #64748b;
    --border-glow: rgba(0, 229, 255, 0.3);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg-deep);
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(168, 85, 247, 0.18) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(0, 229, 255, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 60%),
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 45px 45px, 45px 45px;
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Анимированные частицы фона */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--accent-cyan);
    opacity: 0;
    animation: floatParticle linear infinite;
    box-shadow: 0 0 10px currentColor;
  }
  @keyframes floatParticle {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container { max-width: 1250px; margin: 0 auto; position: relative; z-index: 1; }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 18px;
    margin-bottom: 24px;
    animation: fadeDown 0.6s ease;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    background-size: 200% 200%;
    animation: gradShift 4s ease infinite;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.5), inset 0 0 20px rgba(255,255,255,0.2);
    position: relative;
  }
  .logo-icon::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 19px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    background-size: 200% 200%;
    animation: gradShift 4s ease infinite;
    z-index: -1;
    filter: blur(8px);
    opacity: 0.6;
  }
  @keyframes gradShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .logo-text h1 {
    font-size: 26px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-cyan));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textFlow 6s linear infinite;
  }
  @keyframes textFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .logo-text p {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 3px; text-transform: uppercase; font-weight: 600;
  }

  /* ===== STATS ===== */
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat {
    background: linear-gradient(145deg, var(--bg-panel), rgba(17, 26, 46, 0.6));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 12px 20px;
    text-align: center;
    min-width: 100px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }
  .stat::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--stat-color, var(--accent-cyan)), transparent);
    animation: scanLine 3s ease infinite;
  }
  @keyframes scanLine {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .stat-value {
    font-size: 24px; font-weight: 800;
    color: var(--stat-color, var(--accent-cyan));
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px var(--stat-color, var(--accent-cyan));
    transition: transform 0.2s;
  }
  .stat-value.bump { animation: bump 0.4s ease; }
  @keyframes bump {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
  .stat-label {
    font-size: 9px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
  }

  /* ===== CONTROLBAR ===== */
  .controlbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: rgba(13, 19, 34, 0.7);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 12px 20px;
    margin-bottom: 22px;
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
  }
  .next-order {
    font-size: 13px; color: var(--text-dim);
    letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;
  }
  .next-order strong {
    color: var(--accent-cyan); font-weight: 800;
    font-variant-numeric: tabular-nums; font-size: 16px;
    text-shadow: 0 0 10px var(--accent-cyan);
  }
  .timer-ring {
    width: 34px; height: 34px; position: relative;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-ring circle {
    fill: none; stroke-width: 3;
  }
  .timer-ring .bg { stroke: rgba(255,255,255,0.08); }
  .timer-ring .fg {
    stroke: var(--accent-cyan);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 6px var(--accent-cyan));
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .ctrl-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 7px;
    font-family: inherit;
  }
  .ctrl-btn:hover {
    background: rgba(0, 229, 255, 0.1);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
    transform: translateY(-2px);
  }
  .ctrl-btn.active {
    background: rgba(16, 185, 129, 0.15);
    border-color: var(--accent-green);
    color: var(--accent-green);
  }
  .ctrl-btn.danger:hover {
    background: rgba(239, 68, 68, 0.1);
    border-color: var(--accent-red);
    color: var(--accent-red);
  }

  /* ===== QUEUE BAR ===== */
  .queue-info {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim); margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .queue-dots { display: flex; gap: 4px; }
  .queue-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-cyan);
    animation: dotPulse 1.5s ease infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* ===== BOARD ===== */
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: var(--text-dim);
    animation: fadeIn 0.8s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .empty-radar {
    width: 140px; height: 140px;
    margin: 0 auto 28px; position: relative;
    border-radius: 50%;
    border: 1px solid rgba(0, 229, 255, 0.2);
  }
  .empty-radar::before, .empty-radar::after {
    content: '';
    position: absolute; inset: 20px;
    border-radius: 50%;
    border: 1px solid rgba(0, 229, 255, 0.15);
  }
  .empty-radar::after { inset: 45px; }
  .empty-radar .sweep {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(0, 229, 255, 0.4), transparent 60deg);
    animation: radarSweep 2.5s linear infinite;
  }
  @keyframes radarSweep {
    to { transform: rotate(360deg); }
  }
  .empty-radar .center-dot {
    position: absolute; top: 50%; left: 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    background: var(--accent-cyan); border-radius: 50%;
    box-shadow: 0 0 20px var(--accent-cyan);
    animation: dotPulse 1s ease infinite;
  }
  .empty-state h3 {
    font-size: 18px; color: var(--text-main); margin-bottom: 8px; font-weight: 700;
  }
  .empty-state p { font-size: 13px; opacity: 0.6; }

  /* ===== ORDER CARD ===== */
  .order-card {
    background: linear-gradient(145deg, var(--bg-card), rgba(17, 26, 46, 0.5));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-30px) scale(0.92) rotateX(-10deg); }
    to { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
  }
  .order-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent-cyan);
    opacity: 0.8;
  }
  .order-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-glow);
    box-shadow: 0 20px 50px rgba(0, 229, 255, 0.1);
  }

  .order-card.status-new::before { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); }
  .order-card.status-assembling::before {
    background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold), var(--accent-orange));
    background-size: 200% 100%;
    animation: shimmerBar 2s linear infinite;
  }
  @keyframes shimmerBar {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .order-card.status-shipped::before { background: var(--accent-green); }
  .order-card.status-shipped { opacity: 0.7; }

  .order-card.status-new {
    animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1), newGlow 2s ease infinite;
  }
  @keyframes newGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(0, 229, 255, 0); }
    50% { box-shadow: 0 0 30px rgba(0, 229, 255, 0.15); }
  }

  .order-head {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 14px; gap: 10px;
  }
  .order-id {
    font-size: 14px; font-weight: 800; letter-spacing: 1.5px;
    color: var(--accent-cyan); font-family: 'Courier New', monospace;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
  }
  .order-time { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .order-badge {
    display: inline-block; font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.2px;
    padding: 5px 11px; border-radius: 20px; white-space: nowrap;
  }
  .badge-new {
    background: rgba(0, 229, 255, 0.12); color: var(--accent-cyan);
    border: 1px solid rgba(0, 229, 255, 0.35);
    animation: badgePulse 2s ease infinite;
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 rgba(0, 229, 255, 0.3); }
    50% { box-shadow: 0 0 12px rgba(0, 229, 255, 0.4); }
  }
  .badge-assembling {
    background: rgba(245, 158, 11, 0.12); color: var(--accent-orange);
    border: 1px solid rgba(245, 158, 11, 0.35);
  }
  .badge-shipped {
    background: rgba(16, 185, 129, 0.12); color: var(--accent-green);
    border: 1px solid rgba(16, 185, 129, 0.35);
  }
  .badge-vip {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(236, 72, 153, 0.2));
    color: var(--accent-gold);
    border: 1px solid rgba(251, 191, 36, 0.5);
    margin-left: 6px;
    animation: vipGlow 1.5s ease infinite;
  }
  @keyframes vipGlow {
    0%, 100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.3); }
    50% { box-shadow: 0 0 18px rgba(251, 191, 36, 0.6); }
  }

  .robots-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

  .robot-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 12px 14px;
    transition: background 0.2s, border-color 0.2s;
  }
  .robot-item:hover { background: rgba(255,255,255,0.05); }

  .robot-avatar {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0; position: relative;
  }
  .robot-avatar.miya {
    background: linear-gradient(135deg, rgba(236, 72, 153, 0.3), rgba(168, 85, 247, 0.3));
    border: 1px solid rgba(236, 72, 153, 0.5);
    box-shadow: 0 0 15px rgba(236, 72, 153, 0.2);
    animation: avatarFloat 3s ease-in-out infinite;
  }
  .robot-avatar.rada {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.25), rgba(16, 185, 129, 0.25));
    border: 1px solid rgba(0, 229, 255, 0.5);
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    animation: avatarFloat 3s ease-in-out infinite 0.5s;
  }
  @keyframes avatarFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .robot-info { flex: 1; min-width: 0; }
  .robot-name { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
  .robot-name .miya-name { color: var(--accent-pink); text-shadow: 0 0 10px rgba(236,72,153,0.4); }
  .robot-name .rada-name { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0,229,255,0.4); }
  .robot-serial {
    font-size: 11px; color: var(--text-dim);
    font-family: 'Courier New', monospace; letter-spacing: 0.5px;
  }

  .order-actions { display: flex; gap: 10px; }

  .btn {
    flex: 1; padding: 13px 14px; border: none; border-radius: 12px;
    font-size: 12px; font-weight: 800; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase;
    letter-spacing: 0.8px; font-family: inherit;
    position: relative; overflow: hidden;
  }
  .btn::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.3), transparent 70%);
    opacity: 0; transition: opacity 0.3s;
  }
  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(0.96); }

  .btn-assemble {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08));
    color: var(--accent-orange);
    border: 1px solid rgba(245, 158, 11, 0.5);
  }
  .btn-assemble:hover {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(245, 158, 11, 0.15));
    box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
  }

  .btn-ship {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.08));
    color: var(--accent-green);
    border: 1px solid rgba(16, 185, 129, 0.5);
  }
  .btn-ship:hover {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.15));
    box-shadow: 0 0 25px rgba(16, 185, 129, 0.35);
  }

  .btn:disabled {
    opacity: 0.3; cursor: not-allowed;
    transform: none !important; box-shadow: none !important;
  }

  .btn-status {
    flex: 1; padding: 13px 14px; border-radius: 12px;
    font-size: 12px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.8px; text-align: center; cursor: default;
  }
  .btn-status.assembling {
    background: rgba(245, 158, 11, 0.08); color: var(--accent-orange);
    border: 1px dashed rgba(245, 158, 11, 0.4);
  }
  .btn-status.shipped {
    background: rgba(16, 185, 129, 0.08); color: var(--accent-green);
    border: 1px dashed rgba(16, 185, 129, 0.4);
  }

  /* ===== TOAST ===== */
  .toast-wrap {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 1000; max-width: 340px;
  }
  .toast {
    background: linear-gradient(145deg, var(--bg-panel), rgba(13, 19, 34, 0.9));
    border: 1px solid var(--accent-cyan);
    border-radius: 14px; padding: 14px 18px;
    font-size: 13px; font-weight: 700; color: var(--accent-cyan);
    box-shadow: 0 10px 40px rgba(0, 229, 255, 0.25);
    transform: translateX(120%); opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { transform: translateX(0); opacity: 1; }
  .toast.toast-green { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 10px 40px rgba(16, 185, 129, 0.25); }
  .toast.toast-orange { border-color: var(--accent-orange); color: var(--accent-orange); box-shadow: 0 10px 40px rgba(245, 158, 11, 0.25); }
  .toast.toast-gold {
    border-color: var(--accent-gold); color: var(--accent-gold);
    box-shadow: 0 10px 40px rgba(251, 191, 36, 0.3);
    background: linear-gradient(145deg, rgba(251, 191, 36, 0.1), rgba(13, 19, 34, 0.9));
  }

  /* ===== LEVEL / XP BAR ===== */
  .xp-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 4px; background: rgba(255,255,255,0.05);
    z-index: 999;
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    background-size: 200% 100%;
    animation: gradShift 3s linear infinite;
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 12px var(--accent-cyan);
  }

  /* ===== FLOATING XP ===== */
  .float-xp {
    position: fixed; font-size: 16px; font-weight: 900;
    color: var(--accent-gold); pointer-events: none;
    z-index: 1000; text-shadow: 0 0 15px var(--accent-gold);
    animation: floatUp 1.2s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    30% { transform: translateY(-20px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-80px) scale(1); }
  }

  @media (max-width: 640px) {
    body { padding: 14px; }
    .board { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
    .stats { width: 100%; }
    .stat { flex: 1; min-width: 0; padding: 10px 8px; }
    .stat-value { font-size: 20px; }
    .controlbar { flex-direction: column; align-items: stretch; }
    .controls { justify-content: space-between; }
    .ctrl-btn { flex: 1; justify-content: center; font-size: 11px; padding: 9px 8px; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div class="logo-text">
        <h1>ROBOFACTORY</h1>
        <p>Пульт сборщика · PRO</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat" style="--stat-color: var(--accent-cyan)">
        <div class="stat-value" id="statNew">0</div>
        <div class="stat-label">Новые</div>
      </div>
      <div class="stat" style="--stat-color: var(--accent-orange)">
        <div class="stat-value" id="statAssembling">0</div>
        <div class="stat-label">В сборке</div>
      </div>
      <div class="stat" style="--stat-color: var(--accent-green)">
        <div class="stat-value" id="statShipped">0</div>
        <div class="stat-label">Отправлено</div>
      </div>
      <div class="stat" style="--stat-color: var(--accent-gold)">
        <div class="stat-value" id="statXp">0</div>
        <div class="stat-label">XP</div>
      </div>
    </div>
  </div>

  <div class="controlbar">
    <div class="next-order">
      <div class="timer-ring">
        <svg width="34" height="34">
          <circle class="bg" cx="17" cy="17" r="14"></circle>
          <circle class="fg" id="timerRing" cx="17" cy="17" r="14"
                  stroke-dasharray="87.96" stroke-dashoffset="0"></circle>
        </svg>
      </div>
      <div>
        Следующий заказ через <strong id="countdown">--</strong> сек
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="soundBtn">🔊 Звук: ВКЛ</button>
      <button class="ctrl-btn" id="autoBtn">⚡ Ускорить</button>
      <button class="ctrl-btn danger" id="clearBtn">🗑 Очистить</button>
    </div>
  </div>

  <div class="queue-info">
    <span>Очередь:</span>
    <div class="queue-dots" id="queueDots"></div>
    <span id="queueText">пусто</span>
  </div>

  <div class="board" id="board">
    <div class="empty-state" id="emptyState">
      <div class="empty-radar">
        <div class="sweep"></div>
        <div class="center-dot"></div>
      </div>
      <h3>Сканирование канала...</h3>
      <p>Ожидание входящих заказов от клиентов</p>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="xp-bar"><div class="xp-fill" id="xpFill" style="width: 0%"></div></div>

<script>
  // ============ ДАННЫЕ ============
  const ROBOTS = {
    miya: { name: 'Мия', emoji: '👧', prefix: 'MIYA', cssClass: 'miya', nameClass: 'miya-name' },
    rada: { name: 'Рада', emoji: '🦾', prefix: 'RADA', cssClass: 'rada', nameClass: 'rada-name' }
  };

  const CUSTOMERS = [
    'ООО «ТехноМир»', 'ИП Смирнов', 'АО «КиберДом»', 'ООО «РобоСервис»',
    'ИП Кузнецова', 'ООО «Смарт-Лайн»', 'АО «Будущее+»', 'ИП Волков',
    'ООО «МехаНова»', 'ООО «ГигаСфера»', 'ИП Лебедев', 'АО «Андроид-Плюс»'
  ];

  // ============ СОСТОЯНИЕ ============
  let orders = [];
  let orderCounter = 1000;
  let countdownValue = 0;
  let countdownInterval = null;
  let orderTimer = null;
  let soundEnabled = true;
  let speedMultiplier = 1;
  let totalXp = 0;
  let level = 1;
  const XP_PER_LEVEL = 100;
  const MAX_ORDERS = 12;

  // ============ DOM ============
  const board = document.getElementById('board');
  const emptyState = document.getElementById('emptyState');
  const countdownEl = document.getElementById('countdown');
  const timerRing = document.getElementById('timerRing');
  const toastWrap = document.getElementById('toastWrap');
  const queueDots = document.getElementById('queueDots');
  const queueText = document.getElementById('queueText');
  const xpFill = document.getElementById('xpFill');

  const RING_CIRCUMFERENCE = 2 * Math.PI * 14;

  // ============ УТИЛИТЫ ============
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = arr => arr[randInt(0, arr.length - 1)];

  function generateSerial(type) {
    return `${ROBOTS[type].prefix}-${randInt(10000, 99999)}-${String.fromCharCode(65 + randInt(0, 25))}`;
  }

  function formatTime(date) {
    return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // ============ ЗВУКИ (Web Audio API) ============
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
    if (!soundEnabled) return;
    initAudio();
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration);
  }

  function soundNewOrder() {
    // Восходящее трио — «дзынь»
    playTone(660, 0.15, 'sine', 0.12, 0);
    playTone(880, 0.15, 'sine', 0.12, 0.09);
    playTone(1180, 0.35, 'sine', 0.14, 0.18);
  }

  function soundNewVip() {
    playTone(523, 0.12, 'triangle', 0.14, 0);
    playTone(659, 0.12, 'triangle', 0.14, 0.08);
    playTone(784, 0.12, 'triangle', 0.14, 0.16);
    playTone(1046, 0.5, 'triangle', 0.16, 0.24);
  }

  function soundAssemble() {
    playTone(440, 0.08, 'square', 0.08, 0);
    playTone(550, 0.12, 'square', 0.08, 0.06);
  }

  function soundShip() {
    playTone(880, 0.1, 'sine', 0.12, 0);
    playTone(1100, 0.1, 'sine', 0.12, 0.08);
    playTone(1320, 0.25, 'sine', 0.14, 0.16);
  }

  function soundXp() {
    playTone(1320, 0.08, 'sine', 0.1, 0);
    playTone(1760, 0.2, 'sine', 0.1, 0.06);
  }

  function soundLevelUp() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => {
      playTone(f, 0.2, 'triangle', 0.15, i * 0.1);
    });
  }

  // ============ TOAST ============
  function showToast(message, type = '') {
    const toast = document.createElement('div');
    toast.className = 'toast show' + (type ? ' toast-' + type : '');
    toast.textContent = message;
    toastWrap.appendChild(toast);
    setTimeout(() => {
      toast.style.transform = 'translateX(120%)';
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 400);
    }, 3200);
    // Ограничиваем количество тостов
    while (toastWrap.children.length > 4) {
      toastWrap.firstChild.remove();
    }
  }

  // ============ FLOAT XP ============
  function floatXp(x, y, amount) {
    const el = document.createElement('div');
    el.className = 'float-xp';
    el.textContent = '+' + amount + ' XP';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }

  // ============ ГЕНЕРАЦИЯ ЗАКАЗА ============
  function createOrder() {
    orderCounter++;
    const both = Math.random() < 0.3;
    const isVip = Math.random() < 0.15;
    const robots = [];

    if (both) {
      robots.push({ type: 'miya', serial: generateSerial('miya') });
      robots.push({ type: 'rada', serial: generateSerial('rada') });
    } else {
      const type = Math.random() < 0.5 ? 'miya' : 'rada';
      robots.push({ type, serial: generateSerial(type) });
    }

    return {
      id: 'ORD-' + orderCounter,
      robots,
      customer: pick(CUSTOMERS),
      status: 'new',
      createdAt: new Date(),
      vip: isVip
    };
  }

  // ============ ДОБАВЛЕНИЕ ЗАКАЗА ============
  function addOrder() {
    if (orders.length >= MAX_ORDERS) {
      showToast('⚠️ Очередь переполнена! Собирайте быстрее', 'orange');
      return;
    }

    const order = createOrder();
    orders.unshift(order);
    render();

    const names = order.robots.map(r => ROBOTS[r.type].name).join(' + ');
    if (order.vip) {
      showToast(`⭐ VIP-заказ ${order.id}: ${names}`, 'gold');
      soundNewVip();
    } else {
      showToast(`📦 Новый заказ ${order.id}: ${names}`, '');
      soundNewOrder();
    }
  }

  // ============ ПЛАНИРОВАНИЕ ============
  function scheduleNextOrder() {
    clearTimeout(orderTimer);
    clearInterval(countdownInterval);

    const baseDelay = randInt(8, 15); // чаще!
    const delay = Math.max(3, Math.round(baseDelay / speedMultiplier));
    countdownValue = delay;
    updateCountdown();

    countdownInterval = setInterval(() => {
      countdownValue--;
      updateCountdown();
      if (countdownValue <= 0) clearInterval(countdownInterval);
    }, 1000);

    orderTimer = setTimeout(() => {
      addOrder();
      scheduleNextOrder();
    }, delay * 1000);
  }

  function updateCountdown() {
    const d = Math.max(0, countdownValue);
    countdownEl.textContent = d;
    // Кольцо-таймер
    const total = Math.max(1, countdownValue + 1);
    const offset = RING_CIRCUMFERENCE * (1 - d / Math.max(1, d + 1));
    // Проще: заполненность относительно стартового
    timerRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - d / Math.max(d + 1, d + 5));
  }

  // ============ ДЕЙСТВИЯ ============
  function setAssembling(orderId, event) {
    const order = orders.find(o => o.id === orderId);
    if (!order || order.status !== 'new') return;
    order.status = 'assembling';
    render();
    showToast(`⚙️ Заказ ${orderId} взят в сборку`, 'orange');
    soundAssemble();
    addXp(10, event);
  }

  function setShipped(orderId, event) {
    const order = orders.find(o => o.id === orderId);
    if (!order || order.status !== 'assembling') return;
    order.status = 'shipped';
    render();
    showToast(`✅ Заказ ${orderId} упакован и отправлен`, 'green');
    soundShip();
    const xp = order.vip ? 60 : 40;
    addXp(xp, event);
    // Бонус за «обоих» роботов
    if (order.robots.length === 2) {
      setTimeout(() => addXp(20, null), 300);
    }
    // Автоудаление отправленного через 6 секунд
    setTimeout(() => {
      orders = orders.filter(o => o.id !== orderId);
      render();
    }, 6000);
  }

  // ============ XP ============
  function addXp(amount, event) {
    totalXp += amount;
    const newLevel = Math.floor(totalXp / XP_PER_LEVEL) + 1;
    if (newLevel > level) {
      level = newLevel;
      showToast(`🏆 Уровень ${level}! Отличная работа!`, 'gold');
      soundLevelUp();
    }
    updateXpBar();

    if (event && event.clientX) {
      floatXp(event.clientX - 30, event.clientY - 20, amount);
    }
    soundXp();
  }

  function updateXpBar() {
    const inLevel = totalXp % XP_PER_LEVEL;
    const pct = (inLevel / XP_PER_LEVEL) * 100;
    xpFill.style.width = pct + '%';
    const statXp = document.getElementById('statXp');
    statXp.textContent = totalXp;
  }

  // ============ СТАТИСТИКА ============
  let prevStats = { new: 0, assembling: 0, shipped: 0 };

  function updateStats() {
    const counts = { new: 0, assembling: 0, shipped: 0 };
    orders.forEach(o => counts[o.status]++);

    const setVal = (id, key) => {
      const el = document.getElementById(id);
      el.textContent = counts[key];
      if (counts[key] !== prevStats[key]) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
      }
    };
    setVal('statNew', 'new');
    setVal('statAssembling', 'assembling');
    setVal('statShipped', 'shipped');
    prevStats = counts;
  }

  // ============ ОЧЕРЕДЬ ============
  function updateQueue() {
    queueDots.innerHTML = '';
    const count = Math.min(orders.length, 12);
    for (let i = 0; i < count; i++) {
      const dot = document.createElement('div');
      dot.className = 'queue-dot';
      dot.style.animationDelay = (i * 0.1) + 's';
      if (orders[i].vip) {
        dot.style.background = 'var(--accent-gold)';
        dot.style.boxShadow = '0 0 8px var(--accent-gold)';
      }
      queueDots.appendChild(dot);
    }
    if (orders.length === 0) {
      queueText.textContent = 'пусто';
    } else if (orders.length >= MAX_ORDERS) {
      queueText.textContent = `${orders.length} / ${MAX_ORDERS} ⚠️ ПЕРЕПОЛНЕНО`;
      queueText.style.color = 'var(--accent-red)';
    } else {
      queueText.textContent = `${orders.length} / ${MAX_ORDERS}`;
      queueText.style.color = 'var(--text-dim)';
    }
  }

  // ============ РЕНДЕР ============
  function render() {
    updateStats();
    updateQueue();

    if (orders.length === 0) {
      board.innerHTML = '';
      emptyState.style.display = '';
      board.appendChild(emptyState);
      return;
    }

    emptyState.style.display = 'none';
    board.innerHTML = '';

    orders.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card status-' + order.status;

      let badgeHtml = '';
      if (order.status === 'new') badgeHtml = '<span class="order-badge badge-new">● Новый</span>';
      else if (order.status === 'assembling') badgeHtml = '<span class="order-badge badge-assembling">⚙ В сборке</span>';
      else badgeHtml = '<span class="order-badge badge-shipped">✓ Отправлен</span>';

      if (order.vip) {
        badgeHtml += '<span class="order-badge badge-vip">⭐ VIP</span>';
      }

      const robotsHtml = order.robots.map(r => {
        const info = ROBOTS[r.type];
        return `
          <div class="robot-item">
            <div class="robot-avatar ${info.cssClass}">${info.emoji}</div>
            <div class="robot-info">
              <div class="robot-name"><span class="${info.nameClass}">${info.name}</span></div>
              <div class="robot-serial">S/N: ${r.serial}</div>
            </div>
          </div>
        `;
      }).join('');

      let actionsHtml = '';
      if (order.status === 'new') {
        actionsHtml = `
          <button class="btn btn-assemble" data-action="assemble" data-id="${order.id}">В сборке</button>
          <button class="btn btn-ship" disabled>Упакован</button>
        `;
      } else if (order.status === 'assembling') {
        actionsHtml = `
          <div class="btn-status assembling">⚙ В сборке</div>
          <button class="btn btn-ship" data-action="ship" data-id="${order.id}">Упакован и отправлен</button>
        `;
      } else {
        actionsHtml = `
          <div class="btn-status shipped">✓ Упакован и отправлен</div>
        `;
      }

      card.innerHTML = `
        <div class="order-head">
          <div style="min-width:0;">
            <div class="order-id">${order.id}</div>
            <div class="order-time">${formatTime(order.createdAt)} · ${order.customer}</div>
          </div>
          <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">${badgeHtml}</div>
        </div>
        <div class="robots-list">${robotsHtml}</div>
        <div class="order-actions">${actionsHtml}</div>
      `;

      board.appendChild(card);
    });

    board.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = btn.dataset.id;
        if (btn.dataset.action === 'assemble') setAssembling(id, e);
        if (btn.dataset.action === 'ship') setShipped(id, e);
      });
    });
  }

  // ============ ФОНОВЫЕ ЧАСТИЦЫ ============
  function spawnParticles() {
    const container = document.getElementById('particles');
    const colors = ['#00e5ff', '#a855f7', '#ec4899', '#10b981'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.color = pick(colors);
      p.style.background = p.style.color;
      p.style.animationDuration = (10 + Math.random() * 15) + 's';
      p.style.animationDelay = (Math.random() * 15) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
      container.appendChild(p);
    }
  }

  // ============ УПРАВЛЕНИЕ ============
  document.getElementById('soundBtn').addEventListener('click', function () {
    soundEnabled = !soundEnabled;
    this.textContent = soundEnabled ? '🔊 Звук: ВКЛ' : '🔇 Звук: ВЫКЛ';
    this.classList.toggle('active', soundEnabled);
    if (soundEnabled) {
      initAudio();
      soundAssemble();
    }
  });

  document.getElementById('autoBtn').addEventListener('click', function () {
    if (speedMultiplier === 1) {
      speedMultiplier = 3;
      this.textContent = '⚡ Турбо x3';
      this.classList.add('active');
      showToast('⚡ Турбо-режим: заказы в 3 раза чаще!', 'orange');
      scheduleNextOrder();
    } else {
      speedMultiplier = 1;
      this.textContent = '⚡ Ускорить';
      this.classList.remove('active');
      showToast('Скорость обычная', '');
      scheduleNextOrder();
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (orders.length === 0) {
      showToast('Очередь уже пуста', '');
      return;
    }
    orders = [];
    render();
    showToast('🗑 Очередь очищена', '');
  });

  // ============ СТАРТ ============
  spawnParticles();
  document.getElementById('soundBtn').classList.add('active');

  // Первый заказ — быстро, чтобы не скучать
  const firstDelay = 3;
  countdownValue = firstDelay;
  updateCountdown();
  countdownInterval = setInterval(() => {
    countdownValue--;
    updateCountdown();
    if (countdownValue <= 0) clearInterval(countdownInterval);
  }, 1000);

  orderTimer = setTimeout(() => {
    addOrder();
    scheduleNextOrder();
  }, firstDelay * 1000);

  // Разблокировка звука при первом клике (политика браузеров)
  document.body.addEventListener('click', initAudio, { once: true });

  render();
</script>

</body>
</html>
