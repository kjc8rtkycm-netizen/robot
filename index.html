<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboFactory — Пульт сборщика</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-deep: #0a0e1a;
    --bg-panel: #111827;
    --bg-card: #1a2235;
    --bg-card-hover: #1f2a42;
    --accent-cyan: #00e5ff;
    --accent-purple: #7c3aed;
    --accent-pink: #ec4899;
    --accent-green: #10b981;
    --accent-orange: #f59e0b;
    --text-main: #e5e7eb;
    --text-dim: #6b7280;
    --border-glow: rgba(0, 229, 255, 0.3);
  }

  body {
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg-deep);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(0, 229, 255, 0.12) 0%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    color: var(--text-main);
    min-height: 100vh;
    padding: 24px;
  }

  .header {
    max-width: 1100px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.4);
  }

  .logo-text h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo-text p {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 12px;
  }

  .stat {
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 18px;
    text-align: center;
    min-width: 90px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-cyan);
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .board {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }

  .empty-state .pulse {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 2px solid var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4); }
    50% { box-shadow: 0 0 0 20px rgba(0, 229, 255, 0); }
  }

  .order-card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .order-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-glow);
    box-shadow: 0 10px 40px rgba(0, 229, 255, 0.08);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .order-card.status-assembling {
    border-color: rgba(245, 158, 11, 0.4);
  }

  .order-card.status-shipped {
    border-color: rgba(16, 185, 129, 0.4);
    opacity: 0.75;
  }

  .order-card.status-shipped::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-green);
  }

  .order-card.status-assembling::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-orange);
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .order-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .order-id {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent-cyan);
    font-family: 'Courier New', monospace;
  }

  .order-time {
    font-size: 11px;
    color: var(--text-dim);
  }

  .order-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  .badge-new {
    background: rgba(0, 229, 255, 0.12);
    color: var(--accent-cyan);
    border: 1px solid rgba(0, 229, 255, 0.3);
  }

  .badge-assembling {
    background: rgba(245, 158, 11, 0.12);
    color: var(--accent-orange);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .badge-shipped {
    background: rgba(16, 185, 129, 0.12);
    color: var(--accent-green);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .robots-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .robot-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .robot-avatar {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .robot-avatar.miya {
    background: linear-gradient(135deg, rgba(236, 72, 153, 0.25), rgba(124, 58, 237, 0.25));
    border: 1px solid rgba(236, 72, 153, 0.4);
  }

  .robot-avatar.rada {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(16, 185, 129, 0.2));
    border: 1px solid rgba(0, 229, 255, 0.4);
  }

  .robot-info {
    flex: 1;
  }

  .robot-name {
    font-size: 15px;
    font-weight: 700;
  }

  .robot-name .miya-name { color: var(--accent-pink); }
  .robot-name .rada-name { color: var(--accent-cyan); }

  .robot-serial {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
  }

  .order-actions {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 12px 14px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: inherit;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-assemble {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.08));
    color: var(--accent-orange);
    border: 1px solid rgba(245, 158, 11, 0.4);
  }

  .btn-assemble:hover {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(245, 158, 11, 0.15));
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
  }

  .btn-ship {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.08));
    color: var(--accent-green);
    border: 1px solid rgba(16, 185, 129, 0.4);
  }

  .btn-ship:hover {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(16, 185, 129, 0.15));
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  .btn-status {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
    cursor: default;
  }

  .btn-status.assembling {
    background: rgba(245, 158, 11, 0.1);
    color: var(--accent-orange);
    border: 1px dashed rgba(245, 158, 11, 0.4);
  }

  .btn-status.shipped {
    background: rgba(16, 185, 129, 0.1);
    color: var(--accent-green);
    border: 1px dashed rgba(16, 185, 129, 0.4);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-panel);
    border: 1px solid var(--accent-cyan);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-cyan);
    box-shadow: 0 10px 40px rgba(0, 229, 255, 0.2);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    max-width: 320px;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .toast.toast-green {
    border-color: var(--accent-green);
    color: var(--accent-green);
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.2);
  }

  .toast.toast-orange {
    border-color: var(--accent-orange);
    color: var(--accent-orange);
    box-shadow: 0 10px 40px rgba(245, 158, 11, 0.2);
  }

  .next-order-timer {
    max-width: 1100px;
    margin: 0 auto 20px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    letter-spacing: 0.5px;
  }

  .next-order-timer span {
    color: var(--accent-cyan);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .board { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
    .stats { width: 100%; justify-content: space-between; }
    .stat { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div class="logo-text">
      <h1>ROBOFACTORY</h1>
      <p>Пульт сборщика</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="statNew">0</div>
      <div class="stat-label">Новые</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statAssembling">0</div>
      <div class="stat-label">В сборке</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statShipped">0</div>
      <div class="stat-label">Отправлено</div>
    </div>
  </div>
</div>

<div class="next-order-timer">
  Следующий заказ через <span id="countdown">--</span> сек
</div>

<div class="board" id="board">
  <div class="empty-state" id="emptyState">
    <div class="pulse">📡</div>
    <p>Ожидание входящих заказов...</p>
    <p style="font-size: 12px; margin-top: 8px; opacity: 0.6;">Заказы поступают каждые 30–40 секунд</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ==== Данные о роботах ====
  const ROBOTS = {
    miya: {
      name: 'Мия',
      emoji: '👧',
      serialPrefix: 'MIYA',
      cssClass: 'miya',
      nameClass: 'miya-name'
    },
    rada: {
      name: 'Рада',
      emoji: '🦾',
      serialPrefix: 'RADA',
      cssClass: 'rada',
      nameClass: 'rada-name'
    }
  };

  // ==== Состояние ====
  let orders = [];
  let orderCounter = 1000;
  let nextOrderDelay = 0;
  let countdownValue = 0;
  let countdownInterval = null;
  let orderTimer = null;

  // ==== DOM ====
  const board = document.getElementById('board');
  const emptyState = document.getElementById('emptyState');
  const toast = document.getElementById('toast');
  const countdownEl = document.getElementById('countdown');

  // ==== Утилиты ====
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateSerial(type) {
    const prefix = ROBOTS[type].serialPrefix;
    const num = randInt(10000, 99999);
    const letter = String.fromCharCode(65 + randInt(0, 25));
    return `${prefix}-${num}-${letter}`;
  }

  function formatTime(date) {
    return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function showToast(message, type = '') {
    toast.textContent = message;
    toast.className = 'toast show ' + (type ? 'toast-' + type : '');
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  // ==== Генерация заказа ====
  function createOrder() {
    orderCounter++;
    const type = Math.random() < 0.5 ? 'miya' : 'rada';
    // 25% шанс, что закажут обоих роботов вместе
    const both = Math.random() < 0.25;

    const robots = [];
    if (both) {
      robots.push({ type: 'miya', serial: generateSerial('miya') });
      robots.push({ type: 'rada', serial: generateSerial('rada') });
    } else {
      robots.push({ type, serial: generateSerial(type) });
    }

    return {
      id: 'ORD-' + orderCounter,
      robots,
      status: 'new', // new | assembling | shipped
      createdAt: new Date()
    };
  }

  // ==== Добавление заказа ====
  function addOrder() {
    const order = createOrder();
    orders.unshift(order);
    render();
    const names = order.robots.map(r => ROBOTS[r.type].name).join(' + ');
    showToast(`📦 Новый заказ ${order.id}: ${names}`, '');
  }

  // ==== Планирование следующего заказа ====
  function scheduleNextOrder() {
    clearTimeout(orderTimer);
    clearInterval(countdownInterval);

    nextOrderDelay = randInt(30, 40);
    countdownValue = nextOrderDelay;
    countdownEl.textContent = countdownValue;

    countdownInterval = setInterval(() => {
      countdownValue--;
      countdownEl.textContent = countdownValue > 0 ? countdownValue : 0;
      if (countdownValue <= 0) {
        clearInterval(countdownInterval);
      }
    }, 1000);

    orderTimer = setTimeout(() => {
      addOrder();
      scheduleNextOrder();
    }, nextOrderDelay * 1000);
  }

  // ==== Действия ====
  function setAssembling(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (!order || order.status !== 'new') return;
    order.status = 'assembling';
    render();
    showToast(`⚙️ Заказ ${orderId} взят в сборку`, 'orange');
  }

  function setShipped(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (!order || order.status !== 'assembling') return;
    order.status = 'shipped';
    render();
    showToast(`✅ Заказ ${orderId} упакован и отправлен`, 'green');
  }

  // ==== Обновление статистики ====
  function updateStats() {
    const counts = { new: 0, assembling: 0, shipped: 0 };
    orders.forEach(o => counts[o.status]++);
    document.getElementById('statNew').textContent = counts.new;
    document.getElementById('statAssembling').textContent = counts.assembling;
    document.getElementById('statShipped').textContent = counts.shipped;
  }

  // ==== Рендер ====
  function render() {
    updateStats();

    if (orders.length === 0) {
      board.innerHTML = '';
      board.appendChild(emptyState);
      emptyState.style.display = '';
      return;
    }

    emptyState.style.display = 'none';
    board.innerHTML = '';

    orders.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';
      if (order.status === 'assembling') card.classList.add('status-assembling');
      if (order.status === 'shipped') card.classList.add('status-shipped');

      // Бейдж статуса
      let badgeHtml = '';
      if (order.status === 'new') badgeHtml = '<span class="order-badge badge-new">● Новый</span>';
      else if (order.status === 'assembling') badgeHtml = '<span class="order-badge badge-assembling">⚙ В сборке</span>';
      else badgeHtml = '<span class="order-badge badge-shipped">✓ Отправлен</span>';

      // Роботы
      const robotsHtml = order.robots.map(r => {
        const info = ROBOTS[r.type];
        return `
          <div class="robot-item">
            <div class="robot-avatar ${info.cssClass}">${info.emoji}</div>
            <div class="robot-info">
              <div class="robot-name"><span class="${info.nameClass}">${info.name}</span></div>
              <div class="robot-serial">S/N: ${r.serial}</div>
            </div>
          </div>
        `;
      }).join('');

      // Кнопки
      let actionsHtml = '';
      if (order.status === 'new') {
        actionsHtml = `
          <button class="btn btn-assemble" data-action="assemble" data-id="${order.id}">В сборке</button>
          <button class="btn btn-ship" disabled>Упакован</button>
        `;
      } else if (order.status === 'assembling') {
        actionsHtml = `
          <div class="btn-status assembling">⚙ В сборке</div>
          <button class="btn btn-ship" data-action="ship" data-id="${order.id}">Упакован и отправлен</button>
        `;
      } else {
        actionsHtml = `
          <div class="btn-status shipped">✓ Упакован и отправлен</div>
        `;
      }

      card.innerHTML = `
        <div class="order-head">
          <div>
            <div class="order-id">${order.id}</div>
            <div class="order-time">${formatTime(order.createdAt)}</div>
          </div>
          ${badgeHtml}
        </div>
        <div class="robots-list">${robotsHtml}</div>
        <div class="order-actions">${actionsHtml}</div>
      `;

      board.appendChild(card);
    });

    // Навешиваем обработчики
    board.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        if (btn.dataset.action === 'assemble') setAssembling(id);
        if (btn.dataset.action === 'ship') setShipped(id);
      });
    });
  }

  // ==== Старт ====
  // Первый заказ через 3-7 секунд для быстрого погружения
  const firstDelay = randInt(3, 7);
  countdownValue = firstDelay;
  countdownEl.textContent = firstDelay;
  countdownInterval = setInterval(() => {
    countdownValue--;
    countdownEl.textContent = countdownValue > 0 ? countdownValue : 0;
    if (countdownValue <= 0) clearInterval(countdownInterval);
  }, 1000);

  orderTimer = setTimeout(() => {
    addOrder();
    scheduleNextOrder();
  }, firstDelay * 1000);

  render();
</script>

</body>
</html>
